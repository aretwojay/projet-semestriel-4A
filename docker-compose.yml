services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: byte
      POSTGRES_PASSWORD: byte_dev_password
      POSTGRES_DB: byte_ledger
    ports:
      - "5432:5432"
    volumes:
      - byte_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byte -d byte_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  byte_pg_data:
